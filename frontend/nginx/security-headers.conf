# SCRUM-7-NFR-12 / ADR 0011. Included at server level AND in every location that sets its own add_header
# (nginx does not inherit add_header into such locations).
# SCRUM-13-AC-16, NFR-05 (ADR 0018 §3): the only CSP change is connect-src + the exact Keycloak origin/path ($auth_url,
# set in default.conf from AUTH_URL; trailing slash = path prefix) for the token endpoint (code exchange, refresh).
# Login and logout are top-level navigations, so no frame-src and form-action stays 'self'. Uses $auth_url, so this
# snippet is only valid inside the server block of default.conf.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' $auth_url/; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
