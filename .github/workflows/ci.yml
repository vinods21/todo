# ADR 0008: one workflow for every story. The build identity (Jira key) is derived from the branch once, in job
# `identity`, and injected into the backend (`build`, SCRUM-2-NFR-06) and `frontend` (SCRUM-1-NFR-06) jobs, and
# into job `e2e` (SCRUM-7-AC-20, ADR 0010-0012: container images, Compose stack, Playwright e2e).
# feature/SCRUM-<n>-<slug> -> SCRUM-<n>; main -> main; anything else -> NONE (local builds: UNKNOWN).
# SCRUM-8 (ADR 0013): `identity` also computes the build version X.Y.Z-<sha7> from the Git tags (next patch after the
# latest vX.Y.Z, 0.1.0 before the first release); it is stamped into the jar, build-info.json and both images and
# asserted in each job (SCRUM-8-AC-03, AC-04). Releases themselves are cut by workflow `Release` (release.yml).
name: CI

on:
  push:
    branches:
      - "feature/**"
      - main
  pull_request:

permissions:
  contents: read

jobs:
  identity:
    runs-on: ubuntu-latest
    outputs:
      jira_key: ${{ steps.derive.outputs.jira_key }}
      build_version: ${{ steps.derive.outputs.build_version }}
    steps:
      # SCRUM-8-AC-05: tags are the source of truth for versions → full history + tags (new step: SHA-pinned, NFR-02).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Derive Jira key and build version (ADR 0008, SCRUM-8-AC-03)
        id: derive
        env:
          # Untrusted input (fork PR branch names): passed via env, never interpolated into the script.
          BRANCH: ${{ github.head_ref || github.ref_name }}
          SHA: ${{ github.sha }}
        run: node .github/scripts/release/version.mjs identity --github-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"

  build:
    needs: identity
    runs-on: ubuntu-latest
    env:
      JIRA_KEY: ${{ needs.identity.outputs.jira_key }}
      BUILD_VERSION: ${{ needs.identity.outputs.build_version }} # SCRUM-8-AC-03
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for git-commit-id-maven-plugin (traceability metadata)

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build, test, coverage gate
        run: ./mvnw -B -ntp verify "-Djira.issue=${JIRA_KEY}" "-Drevision=${BUILD_VERSION}"

      # SCRUM-12-AC-05 (ADR 0017): on drift, the unified diff goes to the job summary and — together with the full
      # generated document (plain and base64, between markers) — to the job log, so it can be reviewed and copied into
      # api/openapi.yaml without downloading the artifact.
      - name: OpenAPI drift diff (SCRUM-12-AC-05)
        if: failure() && hashFiles('target/openapi/openapi.generated.yaml') != ''
        run: |
          if [ -f target/openapi/openapi.diff ]; then
            {
              echo "### OpenAPI drift (SCRUM-12-AC-05): committed \`api/openapi.yaml\` vs generated"
              echo '```diff'; cat target/openapi/openapi.diff; echo '```'
              echo "Intended? Take \`openapi.generated.yaml\` from the job log / reports artifact or run \`./mvnw -B test -Dtest=OpenApiDriftIntegrationTest -Dopenapi.update=true\` (README → Changing the API contract)."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "----- BEGIN api/openapi.yaml drift diff -----"; cat target/openapi/openapi.diff; echo "----- END api/openapi.yaml drift diff -----"
          fi
          echo "----- BEGIN generated api/openapi.yaml -----"; cat target/openapi/openapi.generated.yaml; echo "----- END generated api/openapi.yaml -----"
          echo "----- BEGIN generated api/openapi.yaml (base64) -----"; base64 -w0 target/openapi/openapi.generated.yaml; echo; echo "----- END generated api/openapi.yaml (base64) -----"

      - name: Failed test reports (log)
        if: failure()
        run: |
          for f in target/surefire-reports/*.txt; do
            [ -f "$f" ] || continue
            if grep -qE 'FAILURE|ERROR' "$f"; then echo "----- $f"; cat "$f"; fi
          done

      - name: Verify build identity (ADR 0008, SCRUM-8-AC-04; SCRUM-12-AC-10 no OpenAPI generator in the jar)
        run: .github/scripts/verify-jar.sh "target/todo-backend-${BUILD_VERSION}.jar" "$BUILD_VERSION" "$JIRA_KEY" "$GITHUB_SHA"

      - name: Runtime dependencies (SCRUM-12-NFR-01 evidence)
        run: |
          ./mvnw -B -ntp dependency:tree -Dscope=runtime "-Drevision=${BUILD_VERSION}" > target/dependency-tree-runtime.txt
          echo "OpenAPI / Jackson artefacts on the runtime classpath:"
          grep -iE 'swagger|springdoc|jackson' target/dependency-tree-runtime.txt || true

      - name: Coverage summary
        if: always()
        run: |
          if [ -f target/site/jacoco/jacoco.csv ]; then
            awk -F, -v key="$JIRA_KEY" 'NR>1 {m+=$8; c+=$9} END {if (m+c>0) printf "### Backend line coverage (%s): %.1f%%\n", key, (c*100)/(m+c)}' \
              target/site/jacoco/jacoco.csv >> "$GITHUB_STEP_SUMMARY"
          fi
          if ls target/surefire-reports/TEST-*.xml >/dev/null 2>&1; then
            echo "### Backend acceptance criteria exercised by tests (${JIRA_KEY} build)" >> "$GITHUB_STEP_SUMMARY"
            { grep -hoE 'SCRUM-[0-9]+-AC-[0-9]+' target/surefire-reports/TEST-*.xml || true; } | sort -uV | tr '\n' ' ' >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: todo-backend-${{ env.JIRA_KEY }}-${{ github.sha }}
          path: |
            target/todo-backend-*.jar
            !target/*.jar.original
          if-no-files-found: error

      - name: Upload test & coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: todo-backend-${{ env.JIRA_KEY }}-${{ github.sha }}-reports
          path: |
            target/surefire-reports/
            target/site/jacoco/
            target/openapi/
          if-no-files-found: warn

  # SCRUM-1-NFR-06: frontend lint, typecheck, tests (+coverage gate, junit) and production build artifact.
  frontend:
    needs: identity
    runs-on: ubuntu-latest
    env:
      JIRA_KEY: ${{ needs.identity.outputs.jira_key }} # read by vite.config.ts (tests and build)
      APP_VERSION: ${{ needs.identity.outputs.build_version }} # read by vite.config.ts (SCRUM-8-AC-04)
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Contract types up to date (SCRUM-12-AC-06)
        run: npm run api:check # regenerates src/api/schema.d.ts from ../api/openapi.yaml; prints the diff and fails if stale

      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test with coverage gate
        run: npm run test:coverage

      - name: Build
        run: npm run build # JIRA_KEY / GITHUB_SHA / GITHUB_REF_NAME / GITHUB_HEAD_REF / APP_VERSION feed build-info (SCRUM-1-NFR-09)

      - name: Verify build identity (SCRUM-8-AC-04)
        run: |
          node -e '
            const e = process.env
            const b = require("./dist/build-info.json")
            const meta = `<meta name="build-info" content="${e.JIRA_KEY} ${e.GITHUB_SHA} ${e.APP_VERSION}">`
            const html = require("fs").readFileSync("dist/index.html", "utf8")
            if (b.jira !== e.JIRA_KEY || b.version !== e.APP_VERSION || !html.includes(meta)) {
              console.error("::error::build identity mismatch", b, "expected meta", meta)
              process.exit(1)
            }
            console.log(`dist/build-info.json jira = ${b.jira}, version = ${b.version}; meta tag ok`)'

      - name: Test & coverage summary
        if: always()
        run: |
          if [ -f reports/coverage/coverage-summary.json ]; then
            node -e 'const s=require("./reports/coverage/coverage-summary.json").total.lines.pct; console.log(`### Frontend line coverage (${process.env.JIRA_KEY}): ${s}%`)' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f reports/junit.xml ]; then
            echo "### Frontend acceptance criteria exercised by tests (${JIRA_KEY} build)" >> "$GITHUB_STEP_SUMMARY"
            { grep -oE 'SCRUM-[0-9]+-AC-[0-9]+' reports/junit.xml || true; } | sort -uV | tr '\n' ' ' >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: todo-frontend-${{ env.JIRA_KEY }}-${{ github.sha }}
          path: frontend/dist/ # upload-artifact ignores working-directory: repo-relative path
          if-no-files-found: error

      - name: Upload test & coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: todo-frontend-${{ env.JIRA_KEY }}-${{ github.sha }}-reports
          path: |
            frontend/reports/junit.xml
            frontend/reports/coverage/
          if-no-files-found: warn

  # SCRUM-12 (ADR 0017, design §7.4): validate api/openapi.yaml and gate breaking changes against main (merge base).
  # New job → SHA-pinned actions (SCRUM-8-NFR-02).
  api-contract:
    needs: identity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      JIRA_KEY: ${{ needs.identity.outputs.jira_key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # merge-base with origin/main
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc

      - name: Install oasdiff (pinned + checksum)
        run: .github/scripts/release/install-tools.sh oasdiff

      - name: Breaking-change gate self-tests (SCRUM-12-AC-13)
        run: >
          mkdir -p reports &&
          node --test --test-reporter=spec --test-reporter-destination=stdout
          --test-reporter=junit --test-reporter-destination=reports/api-contract-junit.xml
          ".github/scripts/api/test/*.test.mjs"

      - name: Validate the contract and gate breaking changes vs main (SCRUM-12-AC-01, AC-08, AC-09)
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }} # pull_request only; untrusted → env, quoted in the script
          REF_NAME: ${{ github.ref_name }}
          OUT: reports/api-contract
        run: .github/scripts/api-contract.sh

      - name: AC summary
        if: always()
        run: |
          if [ -f reports/api-contract-junit.xml ]; then
            tests=$(grep -c '<testcase' reports/api-contract-junit.xml || true)
            failed=$(grep -c '<failure' reports/api-contract-junit.xml || true)
            echo "### API contract gate tests (${JIRA_KEY} build): ${tests} tests, ${failed} failed" | tee -a "$GITHUB_STEP_SUMMARY"
            { grep -oE 'SCRUM-[0-9]+-(AC|NFR)-[0-9]+' reports/api-contract-junit.xml || true; } | sort -uV | tr '\n' ' ' | tee -a "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: todo-api-contract-${{ env.JIRA_KEY }}-${{ github.sha }}-reports
          path: reports/
          if-no-files-found: warn

  # SCRUM-7-AC-20 (ADR 0010-0012): images + Compose stack + e2e. Parallel to build/frontend.
  e2e:
    needs: identity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JIRA_KEY: ${{ needs.identity.outputs.jira_key }}
      BUILD_VERSION: ${{ needs.identity.outputs.build_version }} # SCRUM-8-AC-03, AC-15: additional image tag + label
      GIT_COMMIT: ${{ github.sha }}
      GIT_BRANCH: ${{ github.head_ref || github.ref_name }} # untrusted (fork PRs): env / action inputs only, always quoted
      TODO_IMAGE_TAG: ${{ needs.identity.outputs.jira_key }}-${{ github.sha }}
      COMPOSE_PROFILES: app
      COMPOSE_PROJECT_NAME: todo-e2e
    steps:
      - uses: actions/checkout@v4

      - name: Lint Dockerfiles (hadolint, SCRUM-7-NFR-12)
        run: docker run --rm -v "$PWD:/w:ro" -w /w hadolint/hadolint:v2.15.1 hadolint --config .hadolint.yaml Dockerfile frontend/Dockerfile

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: |
            e2e/package-lock.json
            frontend/package-lock.json

      - name: Image metadata
        id: meta
        run: |
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image (SCRUM-7-AC-01)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          push: false
          provenance: false
          sbom: false
          tags: |
            todo-backend:${{ env.TODO_IMAGE_TAG }}
            todo-backend:${{ env.BUILD_VERSION }}
          build-args: |
            JIRA_KEY=${{ env.JIRA_KEY }}
            GIT_COMMIT=${{ github.sha }}
            GIT_BRANCH=${{ env.GIT_BRANCH }}
            VERSION=${{ env.BUILD_VERSION }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}
          cache-from: type=gha,scope=todo-backend
          cache-to: type=gha,scope=todo-backend,mode=max

      - name: Build frontend image (SCRUM-7-AC-04)
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          load: true
          push: false
          provenance: false
          sbom: false
          tags: |
            todo-frontend:${{ env.TODO_IMAGE_TAG }}
            todo-frontend:${{ env.BUILD_VERSION }}
          build-args: |
            JIRA_KEY=${{ env.JIRA_KEY }}
            GIT_COMMIT=${{ github.sha }}
            GIT_BRANCH=${{ env.GIT_BRANCH }}
            VERSION=${{ env.BUILD_VERSION }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}
          cache-from: type=gha,scope=todo-frontend
          cache-to: type=gha,scope=todo-frontend,mode=max

      - name: Start stack and wait for health (SCRUM-7-AC-07, AC-09)
        id: stack
        run: docker compose up -d --no-build --wait --wait-timeout 240

      - name: Verify images and containers (SCRUM-7-AC-22, NFR-01..NFR-06; SCRUM-8-AC-04, AC-14)
        if: ${{ !cancelled() && steps.stack.outcome == 'success' }}
        env:
          EXPECTED_VERSION: ${{ env.BUILD_VERSION }}
        run: .github/scripts/verify-images.sh "todo-backend:${TODO_IMAGE_TAG}" "todo-frontend:${TODO_IMAGE_TAG}"

      # SCRUM-9-AC-02 (ADR 0015): e2e deps + cached Chromium, shared with Release job `e2e-release`.
      - name: Playwright and Chromium
        if: ${{ !cancelled() && steps.stack.outcome == 'success' }}
        uses: ./.github/actions/e2e-playwright

      - name: E2E against Compose (SCRUM-7-AC-18, AC-19)
        if: ${{ !cancelled() && steps.stack.outcome == 'success' }}
        working-directory: e2e
        env:
          E2E_EXPECT_EMPTY_DB: "1"
          E2E_JIRA_KEY: ${{ env.JIRA_KEY }}
          E2E_GIT_SHA: ${{ github.sha }}
          E2E_VERSION: ${{ env.BUILD_VERSION }} # SCRUM-8-AC-04
        run: npx playwright test

      - name: Install frontend dependencies (dev mode)
        if: ${{ !cancelled() && steps.stack.outcome == 'success' }}
        working-directory: frontend
        run: npm ci

      - name: E2E dev mode — Vite 5173 → backend 8080 cross-origin (SCRUM-7-AC-21, closes SCRUM-1-AC-14)
        if: ${{ !cancelled() && steps.stack.outcome == 'success' }}
        working-directory: e2e
        env:
          E2E_MODE: dev
        run: npx playwright test

      - name: Lifecycle and persistence (SCRUM-7-AC-03, AC-10)
        if: ${{ !cancelled() && steps.stack.outcome == 'success' }}
        run: .github/scripts/verify-lifecycle.sh

      # SCRUM-9-AC-02 (ADR 0015): summary, diagnostics on failure, Compose logs, `down -v`, report upload — shared
      # with Release job `e2e-release`. Same artifact name and content as before.
      - name: Summary, diagnostics, logs, teardown, reports
        if: always()
        uses: ./.github/actions/e2e-teardown
        with:
          artifact-name: todo-e2e-${{ env.JIRA_KEY }}-${{ github.sha }}-reports
          job-status: ${{ job.status }}
