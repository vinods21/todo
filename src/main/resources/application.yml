# SCRUM-2: application configuration. Environment-specific values come from env vars (SCRUM-2-NFR-05);
# defaults are for local development only (see docker-compose.yml).
spring:
  application:
    name: todo-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/todo}
    username: ${DB_USERNAME:todo}
    password: ${DB_PASSWORD:todo}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          # SCRUM-13 (ADR 0018 §1): the PUBLIC issuer is validated (iss); keys come from the jwk-set-uri (in Compose the
          # internal http://keycloak:8080/...). With both set, Boot builds the decoder from jwk-set-uri: no discovery
          # call, no start-up dependency on Keycloak (NFR-06). JWKS fetched lazily, cached, re-fetched on unknown kid.
          issuer-uri: ${APP_AUTH_ISSUER_URI:http://localhost:8180/realms/todo}
          jwk-set-uri: ${APP_AUTH_JWK_SET_URI:http://localhost:8180/realms/todo/protocol/openid-connect/certs}
          jws-algorithms: [RS256]
          audiences:                                                        # SCRUM-13-AC-18: aud must contain it
            - "${APP_AUTH_AUDIENCE:todo-api}"
          # SCRUM-13-AC-22: Keycloak realm roles -> ROLE_<role>; no realm_access claim = no roles (no error)
          authorities-claim-expressions: ["['realm_access']['roles']"]
          authority-prefix: ROLE_
          principal-claim-name: preferred_username
  web:
    # Boot 4 location of the former server.error.* keys (SCRUM-2-AC-14 backstop for errors outside MVC)
    error:
      include-stacktrace: never
      include-message: never
server:
  port: ${SERVER_PORT:8080}
app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  auth:
    clock-skew: ${APP_AUTH_CLOCK_SKEW:30s}   # SCRUM-13-AC-18: exp/nbf tolerance (max 60s); CI e2e uses 5s
    roles: [todo-user, todo-admin]           # SCRUM-13-AC-21: application roles reported by GET /api/me
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  info:
    git:
      mode: full
# SCRUM-12 / ADR 0017: springdoc-openapi is a TEST-scope dependency and never in the jar. Should it ever reach the
# runtime classpath, these defaults keep the OpenAPI endpoints and the UI off. Contract tests enable profile "openapi".
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
