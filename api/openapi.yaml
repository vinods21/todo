openapi: 3.1.0
info:
  description: "Task REST API of the To-Do application (SCRUM-2, SCRUM-6). Every error response uses the ApiError body (ADR 0003). Contract: ADR 0017."
  title: To-Do Task API
  version: "1"
servers:
- description: "Same origin: nginx proxies /api/** to the backend (ADR 0011)"
  url: /
tags:
- description: "Create, read, list, update, change the status of and delete tasks"
  name: Tasks
paths:
  /api/tasks:
    get:
      description: "Newest first (createdAt DESC, id DESC). size > 100 is clamped to 100. status filters by exactly one exact, case-sensitive enum name; empty, repeated, comma-separated, unknown or wrong-case values are rejected (ADR 0009)."
      operationId: listTasks
      parameters:
      - description: 0-based page index
        in: query
        name: page
        required: false
        schema:
          default: 0
          format: int32
          minimum: 0
          type: integer
      - description: Page size; values above 100 are clamped to 100
        in: query
        name: size
        required: false
        schema:
          default: 20
          format: int32
          minimum: 1
          type: integer
      - description: Only tasks with this status (single value)
        in: query
        name: status
        required: false
        schema:
          $ref: "#/components/schemas/TaskStatus"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageResponseTaskResponse"
          description: One page of tasks
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Invalid page, size or status"
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Unexpected error
      summary: List tasks
      tags:
      - Tasks
    post:
      operationId: createTask
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskCreateRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
          description: Task created
          headers:
            Location:
              description: URL of the created task
              required: true
              schema:
                format: uri
                type: string
              style: simple
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Validation failed, malformed JSON or invalid field value"
        "415":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Content type is not application/json
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Unexpected error
      summary: Create a task
      tags:
      - Tasks
  /api/tasks/{id}:
    delete:
      operationId: deleteTask
      parameters:
      - in: path
        name: id
        required: true
        schema:
          format: int64
          type: integer
      responses:
        "204":
          description: Task deleted
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Non-numeric id
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Task not found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Unexpected error
      summary: Delete a task
      tags:
      - Tasks
    get:
      operationId: getTask
      parameters:
      - in: path
        name: id
        required: true
        schema:
          format: int64
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
          description: The task
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Non-numeric id
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Task not found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Unexpected error
      summary: Get a task
      tags:
      - Tasks
    put:
      description: "Full replacement of title, description, status and dueDate; id and createdAt are unchanged."
      operationId: updateTask
      parameters:
      - in: path
        name: id
        required: true
        schema:
          format: int64
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdateRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
          description: The updated task
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Validation failed, malformed JSON, invalid field value or non-numeric id"
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Task not found
        "415":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Content type is not application/json
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Unexpected error
      summary: Replace a task
      tags:
      - Tasks
  /api/tasks/{id}/status:
    patch:
      description: Changes only the status (any transition) and returns the full task (ADR 0009).
      operationId: updateTaskStatus
      parameters:
      - in: path
        name: id
        required: true
        schema:
          format: int64
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskStatusUpdateRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
          description: The updated task
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Missing, null or invalid status, malformed JSON or non-numeric id"
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Task not found
        "415":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Content type is not application/json
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Unexpected error
      summary: Change the status of a task
      tags:
      - Tasks
components:
  schemas:
    ApiError:
      description: Standard error body of every error response (ADR 0003)
      properties:
        error:
          description: HTTP reason phrase
          type: string
        fieldErrors:
          description: Invalid fields; empty when the error is not a validation failure
          items:
            $ref: "#/components/schemas/FieldErrorItem"
          type: array
        message:
          type: string
        path:
          type: string
        status:
          format: int32
          type: integer
        timestamp:
          format: date-time
          type: string
      required:
      - error
      - fieldErrors
      - message
      - path
      - status
      - timestamp
      type: object
    FieldErrorItem:
      properties:
        field:
          type: string
        message:
          type: string
      required:
      - field
      - message
      type: object
    PageResponseTaskResponse:
      properties:
        items:
          items:
            $ref: "#/components/schemas/TaskResponse"
          type: array
        page:
          format: int32
          type: integer
        size:
          format: int32
          type: integer
        totalElements:
          format: int64
          type: integer
        totalPages:
          format: int32
          type: integer
      required:
      - items
      - page
      - size
      - totalElements
      - totalPages
      type: object
    TaskCreateRequest:
      properties:
        description:
          maxLength: 2000
          minLength: 0
          type:
          - string
          - "null"
        dueDate:
          format: date
          type:
          - string
          - "null"
        status:
          oneOf:
          - $ref: "#/components/schemas/TaskStatus"
          - type: "null"
        title:
          description: Not blank after trimming; at most 200 characters
          maxLength: 200
          minLength: 0
          type: string
      required:
      - title
      type: object
    TaskResponse:
      properties:
        createdAt:
          format: date-time
          type: string
        description:
          type:
          - string
          - "null"
        dueDate:
          format: date
          type:
          - string
          - "null"
        id:
          format: int64
          type: integer
        status:
          $ref: "#/components/schemas/TaskStatus"
        title:
          type: string
      required:
      - createdAt
      - description
      - dueDate
      - id
      - status
      - title
      type: object
    TaskStatus:
      enum:
      - TODO
      - IN_PROGRESS
      - DONE
      type: string
    TaskStatusUpdateRequest:
      properties:
        status:
          $ref: "#/components/schemas/TaskStatus"
      required:
      - status
      type: object
    TaskUpdateRequest:
      properties:
        description:
          maxLength: 2000
          minLength: 0
          type:
          - string
          - "null"
        dueDate:
          format: date
          type:
          - string
          - "null"
        status:
          $ref: "#/components/schemas/TaskStatus"
        title:
          description: Not blank after trimming; at most 200 characters
          maxLength: 200
          minLength: 0
          type: string
      required:
      - status
      - title
      type: object
